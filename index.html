<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIHALO - Sistem Hasil Laboratorium Optimal</title>
    <style>
    /* Mengunci layar agar tidak bisa di-scroll ganda */
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
        background-color: #eff4f2; /* Menyamakan warna latar */
    }
    
    /* Iframe akan mengisi penuh layar dengan presisi */
    .sihalo-iframe {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
</style>
</head>
<body>

    <!-- Ganti URL_WEB_APP_ANDA dengan link dari Google Apps Script -->
    <iframe class="sihalo-iframe" src="https://script.google.com/macros/s/AKfycbyuskwh4U5CgW4syosWnlYQpCeU83iRwLlPZMpMjfMLNWd6BI6NpRn2dNTHjGLL_M_1/exec" allowfullscreen></iframe>

</body>
</html>
